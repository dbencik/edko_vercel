<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edko — Nahrať súbor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Lora:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --sea:#0ea5e9; --sun:#f59e0b; --olive:#16a34a; --red:#ef4444;
  --bg:#f0f9ff; --text:#1e293b; --muted:#64748b; --border:#e2e8f0;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

.header {
  background:linear-gradient(135deg,#0369a1 0%,#0284c7 40%,#0ea5e9 70%,#38bdf8 100%);
  padding:36px 24px 32px; text-align:center; color:white; position:relative; overflow:hidden;
}
.header h1 { font-family:'Lora',serif; font-style:italic; font-size:2rem; margin-bottom:8px; }
.header p { font-size:15px; opacity:.9; }
.navbar {
  display:flex; justify-content:flex-end; gap:8px;
  padding:12px 20px; position:absolute; top:0; right:0; z-index:2;
}
.nav-btn {
  display:flex; align-items:center; gap:6px; padding:8px 14px;
  background:rgba(255,255,255,.18); border-radius:10px; text-decoration:none;
  color:white; font-size:13px; font-weight:700; backdrop-filter:blur(6px); transition:background .2s;
}
.nav-btn:hover { background:rgba(255,255,255,.32); }
.nav-btn .nav-icon { font-size:16px; }

.container { max-width:500px; margin:-20px auto 40px; padding:0 16px; position:relative; z-index:1; }

.upload-box {
  background:white; border-radius:16px; padding:32px 24px;
  box-shadow:0 2px 12px rgba(0,0,0,.06); border:2px dashed var(--border);
  text-align:center; cursor:pointer; transition:all .2s;
}
.upload-box:hover, .upload-box.dragover {
  border-color:var(--sea); background:#f0f9ff;
}
.upload-box .icon { font-size:48px; margin-bottom:12px; }
.upload-box p { color:var(--muted); font-size:14px; margin-bottom:16px; }
.upload-box input[type="file"] { display:none; }
.upload-btn {
  display:inline-block; padding:12px 28px; background:var(--sea); color:white;
  border:none; border-radius:12px; font-family:'Nunito',sans-serif; font-size:16px;
  font-weight:800; cursor:pointer; transition:background .2s;
}
.upload-btn:hover { background:#0284c7; }

.file-list { margin-top:16px; }
.file-item {
  background:white; border-radius:12px; padding:14px 18px; margin-bottom:8px;
  display:flex; align-items:center; gap:12px; border:2px solid var(--border);
  font-size:14px;
}
.file-item .name { flex:1; font-weight:700; word-break:break-all; }
.file-item .status { font-size:12px; font-weight:800; }
.file-item .status.ok { color:var(--olive); }
.file-item .status.err { color:var(--red); }
.file-item .status.uploading { color:var(--sun); }

.note {
  background:#fef3c7; border-radius:12px; padding:14px 18px; margin-top:16px;
  font-size:13px; color:#92400e; line-height:1.5;
}

.back-link {
  display:inline-block; margin-top:20px; padding:10px 20px; background:white;
  border-radius:12px; text-decoration:none; color:var(--text); font-weight:700;
  border:2px solid var(--border); font-size:14px;
}
.back-link:hover { border-color:var(--sea); }
.footer { text-align:center; padding:20px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>

<div class="header">
  <div class="navbar">
    <a class="nav-btn" href="index.html"><span class="nav-icon">📚</span> Učenie</a>
    <a class="nav-btn" href="rodic.html"><span class="nav-icon">👨‍👩‍👦</span> Rodič</a>
  </div>
  <h1>Nahrať súbor</h1>
  <p>Pošli mame poznámky, zadania alebo fotky</p>
</div>

<div class="container">
  <div class="upload-box" id="dropzone" onclick="document.getElementById('fileInput').click()">
    <div class="icon">📎</div>
    <p>Klikni alebo pretiahni sem súbory</p>
    <button class="upload-btn" onclick="event.stopPropagation(); document.getElementById('fileInput').click()">Vybrať súbory</button>
    <input type="file" id="fileInput" multiple accept="image/*,.pdf,.doc,.docx,.txt,.html">
  </div>

  <div class="file-list" id="fileList"></div>

  <div class="note">
    Nahraté súbory sa automaticky objavia v zdieľanom priečinku na iCloude.
    Mama ich tam uvidí.
  </div>

  <a class="back-link" href="index.html">← Späť na učenie</a>
</div>

<div class="footer">Učenie je superschopnosť</div>

<script>
var dropzone = document.getElementById('dropzone');
var fileInput = document.getElementById('fileInput');
var fileList = document.getElementById('fileList');

/* Drag & drop */
['dragenter','dragover'].forEach(function(ev) {
  dropzone.addEventListener(ev, function(e) { e.preventDefault(); dropzone.classList.add('dragover'); });
});
['dragleave','drop'].forEach(function(ev) {
  dropzone.addEventListener(ev, function(e) { e.preventDefault(); dropzone.classList.remove('dragover'); });
});
dropzone.addEventListener('drop', function(e) {
  e.preventDefault();
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', function() {
  handleFiles(this.files);
  this.value = '';
});

function handleFiles(files) {
  Array.from(files).forEach(function(file) {
    uploadFile(file);
  });
}

function uploadFile(file) {
  var item = document.createElement('div');
  item.className = 'file-item';
  item.innerHTML = '<span style="font-size:20px">📄</span>' +
    '<span class="name">' + esc(file.name) + ' <span style="color:var(--muted);font-weight:400;font-size:12px">(' + formatSize(file.size) + ')</span></span>' +
    '<span class="status uploading">Nahrávam...</span>';
  fileList.prepend(item);

  var statusEl = item.querySelector('.status');

  fetch('/api/upload?filename=' + encodeURIComponent(file.name), {
    method: 'PUT',
    body: file,
  })
  .then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(function(data) {
    statusEl.textContent = 'Nahraté!';
    statusEl.className = 'status ok';
  })
  .catch(function(err) {
    statusEl.textContent = 'Chyba';
    statusEl.className = 'status err';
    console.error('Upload failed:', err);
  });
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
